<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="The walk up Mount Inari">
  <!-- A schematic drawn for the example trip, not a survey: which way, what's where, how long. -->
  <rect width="900" height="760" fill="#fbfaf7"/>
  <text x="40" y="62" font-family="sans-serif" font-size="34" font-weight="800" fill="#14161b">Mount Inari · 稲荷山</text>
  <text x="40" y="100" font-family="sans-serif" font-size="24" fill="#6b7280">Up through the gates, round the top, same way down</text>

  <!-- summit loop -->
  <ellipse cx="610" cy="250" rx="170" ry="95" fill="none" stroke="#2FB3A3" stroke-width="10" stroke-dasharray="2 18" stroke-linecap="round"/>
  <!-- the main path: gate → Senbon Torii → Okusha → Yotsutsuji -->
  <path d="M170 690 C 220 610, 300 600, 330 540 S 380 420, 450 380 S 470 320, 470 290"
        fill="none" stroke="#D1091E" stroke-width="14" stroke-linecap="round" stroke-dasharray="26 12"/>

  <g font-family="sans-serif">
    <circle cx="170" cy="690" r="16" fill="#D1091E"/>
    <text x="200" y="682" font-size="28" font-weight="800" fill="#14161b">Rōmon gate · 楼門</text>
    <text x="200" y="714" font-size="22" fill="#6b7280">from Inari Station, 1 min</text>

    <circle cx="330" cy="540" r="13" fill="#E29000"/>
    <text x="356" y="548" font-size="26" font-weight="800" fill="#14161b">Senbon Torii · 千本鳥居</text>

    <circle cx="450" cy="380" r="13" fill="#E29000"/>
    <text x="80" y="398" font-size="26" font-weight="800" fill="#14161b">Okusha · 奥社</text>

    <circle cx="470" cy="290" r="18" fill="#00B2ED"/>
    <text x="160" y="270" font-size="28" font-weight="800" fill="#14161b">Yotsutsuji · 四ツ辻</text>
    <text x="160" y="302" font-size="22" fill="#6b7280">the city view · ~45 min up</text>

    <circle cx="700" cy="168" r="16" fill="#2FB3A3"/>
    <text x="560" y="140" font-size="28" font-weight="800" fill="#14161b">Summit · 一ノ峰</text>
    <text x="560" y="372" font-size="22" fill="#2FB3A3" font-weight="700">loop over the top · ~1 h</text>
  </g>
  <text x="860" y="735" font-family="sans-serif" font-size="18" fill="#9ca3af" text-anchor="end">schematic · not to scale</text>
</svg>
