<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trip</title>
<meta name="description" content="A live, offline trip timeline.">
<meta name="theme-color" content="#fbfaf7">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- The home-screen name: app.js fills it from the manifest's short_name. -->
<meta name="apple-mobile-web-app-title" content="">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- The words on this page are defaults: app.js replaces them from trip.json's ui. -->
<a class="skip" id="skip" href="#timeline">Skip to timeline</a>

<header class="topbar">
  <div class="brand">
    <img src="assets/favicon.svg" alt="" width="44" height="44" class="brand-mark">
    <!-- The wordmark comes from trip.json's brand. -->
    <span class="brand-name" id="brandName"></span>
  </div>
  <div class="trip-progress">
    <span class="rail"><i class="fill" id="tripFill"></i></span>
    <span class="pct" id="tripPct"></span>
  </div>
</header>

<!-- Live status: always shows what is happening now or next -->
<section class="status" id="status" aria-live="polite" aria-atomic="true">
  <div class="status-inner">
    <div class="status-head">
      <span class="status-label" id="statusLabel">—</span>
      <span class="status-count" id="statusCount"></span>
    </div>
    <button class="status-card" id="statusCard" type="button" data-static="1">
      <span class="status-icon" id="statusIcon" aria-hidden="true"></span>
      <span class="status-body">
        <span class="status-title" id="statusTitle">Loading…</span>
        <span class="status-sub" id="statusSub"></span>
      </span>
      <span class="status-time" id="statusTime"></span>
    </button>
    <div class="status-bar"><i id="statusProgress"></i><span class="status-plane" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span><span class="status-train" aria-hidden="true"><svg viewBox="0 0 34 16" width="34" height="16"><path fill="currentColor" d="M3 2h17c6 0 11 4 12.5 9 .3 1.1-.5 2-1.6 2H3c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2z"/><g fill="#fff"><rect x="4" y="4.5" width="4" height="3" rx="1"/><rect x="10" y="4.5" width="4" height="3" rx="1"/><rect x="16" y="4.5" width="4" height="3" rx="1"/><path d="M22 4.5h.6c2.3 0 4.3 1.2 5.4 3H22z"/><rect x="2" y="9.5" width="28" height="1.2" rx=".6"/></g></svg></span></div>
  </div>
</section>

<!-- Live, network-only: trip.json's links. -->
<nav class="live" id="live" aria-label="Live information"></nav>

<main id="timeline" class="timeline"></main>

<div class="update" id="update" hidden role="alert">
  <span class="update-icon" aria-hidden="true">🔄</span>
  <span class="update-text"><b id="updateTitle">Trip update ready</b><small id="updateText">New plan details are downloaded. Tap Update to see them.</small></span>
  <span class="update-btns">
    <button class="update-go" id="updateGo" type="button">Update</button>
    <button class="update-later" id="updateLater" type="button">Later</button>
  </span>
</div>

<!-- The install offer: once, at the bottom, never above the timeline. -->
<div class="update install" id="install" hidden role="dialog" aria-labelledby="installTitle">
  <span class="update-icon" aria-hidden="true">📲</span>
  <span class="update-text"><b id="installTitle">Keep this trip on your phone</b><small id="installText"></small></span>
  <span class="update-btns">
    <button class="update-go" id="installGo" type="button">Install</button>
    <button class="update-later" id="installLater" type="button">Not now</button>
  </span>
</div>

<button class="jump" id="jumpNow" type="button" hidden>
  <span aria-hidden="true">◎</span> <span id="jumpLabel">Now</span>
</button>

<footer class="foot">
  <p class="foot-btns">
    <button class="foot-btn" id="installFoot" type="button" hidden>📲 Install as an app</button>
    <button class="foot-btn" id="calendarFoot" type="button" hidden>📅 Add to calendar</button>
  </p>
  <p id="footTrip"></p>
  <p class="muted" id="footTz"></p>
  <p class="muted" id="wxNote" hidden></p>
  <p class="muted build">build <code id="build">__BUILD__</code></p>
</footer>

<!-- Event detail -->
<dialog id="sheet" class="sheet">
  <form method="dialog" class="sheet-close"><button aria-label="Close">✕</button></form>
  <div id="sheetBody" class="sheet-body"></div>
</dialog>

<!-- Fullscreen QR / ticket / driver card, for holding up at a gate or in a car -->
<dialog id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <div id="lightboxBody" class="lightbox-body"></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
