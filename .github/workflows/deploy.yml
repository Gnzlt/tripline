name: Check and deploy

# Every push and pull request runs the checks. A push to main also deploys, to whichever
# host the repo is set up for — none of them until it is, so a fresh copy of this
# template stays green:
#   Firebase Hosting: a FIREBASE_SERVICE_ACCOUNT secret and a committed .firebaserc
#   Cloudflare:       CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (wrangler.jsonc)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tools/check.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Which hosts?
        id: ready
        run: |
          firebase=false; cloudflare=false
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -f .firebaserc ]; then firebase=true; fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then cloudflare=true; fi
          if [ "$firebase" = false ] && [ "$cloudflare" = false ]; then
            echo "::notice::Deploy skipped: no host is set up yet. See Hosting in the README."
          fi
          echo "firebase=$firebase" >> "$GITHUB_OUTPUT"
          echo "cloudflare=$cloudflare" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$firebase" = true ] || [ "$cloudflare" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.ready.outputs.any == 'true'
        with:
          node-version: '24'

      # Stamp the service worker and the footer with this commit, so every deploy is a new
      # version: phones notice it and offer the update.
      - name: Stamp build id
        if: steps.ready.outputs.any == 'true'
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/tripline-v[0-9]*/tripline-${BUILD}/" public/sw.js
          sed -i "s/__BUILD__/${BUILD}/" public/index.html

      - name: Deploy to Firebase Hosting
        if: steps.ready.outputs.firebase == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting --non-interactive

      - name: Deploy to Cloudflare
        if: steps.ready.outputs.cloudflare == 'true'
        run: npx --yes wrangler@4 deploy
