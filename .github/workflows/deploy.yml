name: Check and deploy

# Every push and pull request runs the checks. A push to main also deploys to Cloudflare
# (wrangler.jsonc) once the repo has CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets;
# until then it skips, so a fresh copy of this template stays green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tools/check.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Cloudflare set up?
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. See Hosting in the README."
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.ready.outputs.cloudflare == 'true'
        with:
          node-version: '24'

      # Stamp the service worker and the footer with this commit, so every deploy is a new
      # version: phones notice it and offer the update.
      - name: Stamp build id
        if: steps.ready.outputs.cloudflare == 'true'
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/tripline-v[0-9]*/tripline-${BUILD}/" public/sw.js
          sed -i "s/__BUILD__/${BUILD}/" public/index.html

      - name: Deploy to Cloudflare
        if: steps.ready.outputs.cloudflare == 'true'
        run: npx --yes wrangler@4 deploy
